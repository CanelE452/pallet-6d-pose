<style>
:root{color-scheme:light}*{box-sizing:border-box}body{margin:0;background:#edf1f5;color:#182c40;font:15px/1.55 sans-serif}header{padding:14px 22px 8px;background:white}h1{font-size:23px;margin:0 0 5px}p{margin:5px 0}button,select,input{font:inherit;padding:7px 10px;border:1px solid #bcc8d4;border-radius:5px;background:white}button{cursor:pointer}button:hover,.active{background:#dcebf7}button:disabled{opacity:.45;cursor:default}.toolbar{position:sticky;top:0;z-index:10;padding:9px 18px;background:#f8fbff;border-bottom:1px solid #b6c4d1;display:flex;flex-wrap:wrap;gap:7px;align-items:center}.toolbar select#case{max-width:510px;min-width:300px}.toolbar input{width:175px}.stages{display:flex;gap:4px;overflow-x:auto;padding:7px 18px;background:#e5eef6}.stages button{white-space:nowrap}#caseInfo{padding:12px 20px;background:white;border-bottom:1px solid #c9d5df}.legend span{display:inline-block;margin-right:13px}.good{color:#146638}.bad{color:#ae2d24}.muted{color:#667788}.badge{display:inline-block;padding:1px 6px;margin:2px;border-radius:4px;background:#fff0df;color:#9b4215}.overflow{overflow-x:auto;padding:0 12px 22px}.grid{display:grid;grid-template-columns:116px repeat(5,minmax(285px,1fr));gap:8px;min-width:1610px;align-items:stretch}.method{font-size:18px;font-weight:bold;padding:11px 12px;background:#dce8f2;border-top:4px solid var(--color);position:sticky;top:0;z-index:2}.stageTitle{font-weight:bold;padding:15px 10px;background:#dfe8f0;scroll-margin-top:75px}.panel{background:white;border:1px solid #d4dfe8;border-radius:5px;padding:9px;min-width:0}.panel h3{font-size:14px;margin:0 0 5px;min-height:23px}.panel p{font-size:12px;overflow-wrap:anywhere}.panel canvas{display:block;width:100%;height:auto;background:#dfe4e9;cursor:zoom-in}.unavailable{color:#74818f;background:#f7f9fb}.metric{font-weight:bold;margin:5px 0;font-size:14px}.audit{font-size:12px;max-height:230px;overflow:auto;white-space:pre-wrap}details summary{cursor:pointer}table{border-collapse:collapse;font-size:12px;width:100%}td,th{padding:4px;border-bottom:1px solid #ddd;text-align:left}.statekey{font-family:monospace}.stageRow{display:contents}.stageRow.hidden{display:none}dialog{max-width:95vw;max-height:95vh;border:0;padding:15px;border-radius:8px}dialog::backdrop{background:#14263ccc}dialog img{display:block;max-width:90vw;max-height:79vh}#viewerCaption{max-width:1100px}.footer{padding:12px 22px;color:#5b6e80;font-size:12px}#error{padding:20px;background:#ffe4df;color:#8a2115;display:none}
</style>
<header><h1>제외71장 · 방법별 병렬 과정</h1><p>같은 이미지와 확대 범위로 다섯 방법을 나란히 봅니다. 아래로 내리면 입력부터 최종 자세까지 이어집니다. <b>저장된 실제 단계만 표시하며, 모든 상자는 예측입니다.</b></p></header>
<div class="toolbar"><button id="prev">← 이전</button><select id="case" aria-label="이미지 선택"></select><button id="next">다음 →</button><strong id="position"></strong><input id="search" placeholder="ID 검색" aria-label="이미지 ID 검색"><span id="searchState"></span><select id="viewport" aria-label="공통 확대 범위"><option value="roi">공통 확대 범위</option><option value="full">전체 프레임</option></select><label><input id="masks" type="checkbox" checked style="width:auto"> 마스크</label><select id="maskKind" aria-label="표시할 저장 마스크"><option value="pallet">관측/외곽용 마스크</option><option value="state">상태 판정용 마스크</option></select><label><input id="rays" type="checkbox" checked style="width:auto"> 실제 관측선</label><label><input id="alternatives" type="checkbox" checked style="width:auto"> 저장된 대안 자세</label><button id="reset">초기화</button></div>
<div class="stages" id="stageButtons"></div><div id="caseInfo"></div><div id="error"></div><div class="overflow"><div class="grid" id="grid"></div></div>
<div class="footer">S는 해당 상태별 경로의 영상 관측에서 제외됩니다. 번호0–7은 각 경로의 native 코너 ID이며, 다른 열의 같은 번호가 같은 물리 코너임을 증명하지 않습니다. 마스크·선은 저장된 관측이며 새 추론·선 탐색·PnP·정답 fit을 수행하지 않았습니다.</div>
<dialog id="viewer"><button id="closeViewer">닫기</button><p id="viewerCaption"></p><canvas id="viewerImage" width="1920" height="1080" style="max-width:90vw;max-height:79vh;width:1600px;height:auto" aria-label="선택 단계 확대"></canvas></dialog>
<script id="payload" type="application/json">__PAYLOAD__</script>
<script>
'use strict';
const DATA=JSON.parse(document.getElementById('payload').textContent);
const METHODS=[['R0','RAW YOLO + F','#687a8d'],['POSEFIX_RAW','PoseFix + F','#b73594'],['N0','N3 → SubPix + F','#dc8b12'],['N1','N3 → SubPix + 최소 B/I','#d64b30'],['E0','기존 전체 방법 e','#136eaa']];
const STAGES=['1. 공통 입력','2. 키포인트 보정','3. 초기 자세 / 상태','4. 마스크·선·B/I','5. 자세 선택 기록','6. 최종 자세'];
const STATE={B:'#00aac4',I:'#8b4ccd',O:'#de9015',T:'#c84966',U:'#78838b',S:'#283441'};
const EDGES=[[0,1],[1,2],[2,3],[3,0],[4,5],[5,6],[6,7],[7,4],[0,4],[1,5],[2,6],[3,7]];
let selected=0,stage=-1,renderToken=0,loadedImages=new Map(),renderStats={cases:DATA.cases.length,canvases:0,missingImages:[],lastID:null,complete:false};
window.parallelGalleryStats=renderStats;
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=(x,n=2)=>Number.isFinite(x)?x.toFixed(n):'NA';
const finite=q=>Array.isArray(q)&&q.length>=2&&q.every(Number.isFinite)&&!(q[0]===-1&&q[1]===-1);
function img(url){if(!loadedImages.has(url))loadedImages.set(url,new Promise((resolve,reject)=>{const i=new Image();i.onload=()=>resolve(i);i.onerror=()=>{renderStats.missingImages.push(url);reject(Error('이미지 읽기 실패: '+url))};i.src=url}));return loadedImages.get(url)}
function metric(c,key){const m=c.metrics[key];return `위치 ${fmt(m.translation_cm)}cm / 회전 ${fmt(m.rotation_deg)}°`}
function wire(ctx,xy,color,dashed=false,alpha=1){if(!xy)return;ctx.save();ctx.strokeStyle=color;ctx.lineWidth=2.8;ctx.globalAlpha=alpha;if(dashed)ctx.setLineDash([8,5]);for(const [a,b]of EDGES){if(!finite(xy[a])||!finite(xy[b]))continue;const p=ctx._xy(xy[a]),q=ctx._xy(xy[b]);ctx.beginPath();ctx.moveTo(...p);ctx.lineTo(...q);ctx.stroke()}ctx.restore()}
function point(ctx,q,label,color,style='cross'){if(!finite(q))return;const [x,y]=ctx._xy(q);if(x<0||y<0||x>960||y>540)return;ctx.save();ctx.strokeStyle=color;ctx.fillStyle=color;ctx.lineWidth=2.5;ctx.beginPath();if(style==='cross'){ctx.moveTo(x-5,y-5);ctx.lineTo(x+5,y+5);ctx.moveTo(x+5,y-5);ctx.lineTo(x-5,y+5)}else{ctx.arc(x,y,5,0,Math.PI*2);if(style!=='hollow')ctx.fill()}ctx.stroke();if(label!==''){ctx.font='bold 17px sans-serif';ctx.lineWidth=3;ctx.strokeStyle='white';ctx.strokeText(label,x+7,y-7);ctx.fillText(label,x+7,y-7)}ctx.restore()}
function points(ctx,q,color){if(q)q.slice(0,8).forEach((p,k)=>point(ctx,p,String(k),color))}
function states(ctx,m){if(!m.states)return;for(let k=0;k<8;k++){const s=m.states[k];let q=s==='S'?m.coarse_xy?.[k]:m.points?.[k];point(ctx,q,`${k}:${s}`,STATE[s]||'#777',s==='S'?'hollow':'cross')}}
function measurements(ctx,m){for(const a of m.measurements||[]){const k=a.native_corner??a.native_id;const old=m.points?.[k],q=a.xy,fallback=a.source==='VISIBLE_BACKBONE_FALLBACK';const color=fallback?'#7c858e':STATE[a.state]||'#00aac4';point(ctx,old,'','#7c858e');point(ctx,q,`${k}:${a.state}${fallback?' 유지':''}`,color,a.used_as_complete_final_likelihood===false?'hollow':fallback?'cross':'circle');if(finite(old)&&finite(q)){const p=ctx._xy(old),v=ctx._xy(q);ctx.save();ctx.strokeStyle=color;ctx.lineWidth=2.5;ctx.beginPath();ctx.moveTo(...p);ctx.lineTo(...v);ctx.stroke();const dx=v[0]-p[0],dy=v[1]-p[1],angle=Math.atan2(dy,dx);if(Math.hypot(dx,dy)>2){ctx.beginPath();ctx.moveTo(...v);ctx.lineTo(v[0]-8*Math.cos(angle-.5),v[1]-8*Math.sin(angle-.5));ctx.lineTo(v[0]-8*Math.cos(angle+.5),v[1]-8*Math.sin(angle+.5));ctx.closePath();ctx.fillStyle=color;ctx.fill()}ctx.restore()}}}
function observedLines(ctx,m){if(!document.getElementById('rays').checked)return;for(const r of m.rays||[]){const pts=r.observed_points||[];for(const q of pts)point(ctx,q,'','#2be0ca','circle');if(pts.length<2||!r.normal||!Number.isFinite(r.offset))continue;const n=r.normal,t=[-n[1],n[0]],c=pts.reduce((v,q)=>[v[0]+q[0]/pts.length,v[1]+q[1]/pts.length],[0,0]);const n2=n[0]*n[0]+n[1]*n[1];if(n2<1e-10)continue;const e=(n[0]*c[0]+n[1]*c[1]+r.offset)/n2,p=[c[0]-e*n[0],c[1]-e*n[1]];let ts=pts.map(q=>(q[0]-p[0])*t[0]+(q[1]-p[1])*t[1]);const ends=[Math.min(...ts)-3,Math.max(...ts)+3].map(s=>ctx._xy([p[0]+s*t[0],p[1]+s*t[1]]));ctx.save();ctx.strokeStyle='#fbef44';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(...ends[0]);ctx.lineTo(...ends[1]);ctx.stroke();ctx.restore()}}
function regions(ctx,m){for(const r of m.regions||[]){ctx.save();ctx.strokeStyle='#eda72c';ctx.fillStyle='#edaf3320';ctx.lineWidth=2.4;ctx.setLineDash([7,5]);ctx.beginPath();if(r.shape==='ellipse'&&finite(r.center_xy)&&r.half_axes_px){const p=ctx._xy(r.center_xy),ex=ctx._xy([r.center_xy[0]+r.half_axes_px[0],r.center_xy[1]]),ey=ctx._xy([r.center_xy[0],r.center_xy[1]+r.half_axes_px[1]]);ctx.ellipse(p[0],p[1],Math.abs(ex[0]-p[0]),Math.abs(ey[1]-p[1]),(r.angle_deg||0)*Math.PI/180,0,2*Math.PI);ctx.fill();ctx.stroke()}else if(r.shape==='tangent_interval'&&r.normal&&r.interval){const n=r.normal,t=[-n[1],n[0]],n2=n[0]*n[0]+n[1]*n[1];if(n2>0){const base=[-r.offset*n[0]/n2,-r.offset*n[1]/n2];const ends=r.interval.map(s=>ctx._xy([base[0]+s*t[0],base[1]+s*t[1]]));ctx.moveTo(...ends[0]);ctx.lineTo(...ends[1]);ctx.lineWidth=5;ctx.stroke()}}else if(r.vertices?.length>=3){r.vertices.forEach((q,i)=>{const p=ctx._xy(q);if(i)ctx.lineTo(...p);else ctx.moveTo(...p)});ctx.closePath();ctx.fill();ctx.stroke()}ctx.restore()}}
async function draw(canvas,c,key,s){const m=c.methods[key],color=METHODS.find(r=>r[0]===key)[2],token=renderToken;
 const image=await img(c.image);if(token!==renderToken)return;const ctx=canvas.getContext('2d');canvas.width=960;canvas.height=540;ctx.fillStyle='#e0e6eb';ctx.fillRect(0,0,960,540);
 const roi=document.getElementById('viewport').value==='full'?[0,0,c.raw_hw[1],c.raw_hw[0]]:c.roi;const scale=Math.min(960/(roi[2]-roi[0]),540/(roi[3]-roi[1])),ox=(960-(roi[2]-roi[0])*scale)/2,oy=(540-(roi[3]-roi[1])*scale)/2;
 ctx._xy=q=>[(q[0]-roi[0])*scale+ox,(q[1]-roi[1])*scale+oy];ctx.imageSmoothingEnabled=false;ctx.drawImage(image,roi[0]*image.width/c.raw_hw[1],roi[1]*image.height/c.raw_hw[0],(roi[2]-roi[0])*image.width/c.raw_hw[1],(roi[3]-roi[1])*image.height/c.raw_hw[0],ox,oy,(roi[2]-roi[0])*scale,(roi[3]-roi[1])*scale);
 ctx.save();ctx.beginPath();ctx.rect(ox,oy,(roi[2]-roi[0])*scale,(roi[3]-roi[1])*scale);ctx.clip();
 if(s===0){points(ctx,m.input_points||c.raw_points,'#d64b30')}
 if(s===1){points(ctx,m.intermediate_points||m.points,color);if(key==='R0')wire(ctx,m.coarse_xy,color)}
 if(s===2){wire(ctx,m.coarse_xy,color,false,m.states ? 0.65 : 1);if(m.states)states(ctx,m);else points(ctx,m.points,color)}
 if(s===3){if(m.states){const maskUrl=m.masks?.[document.getElementById('maskKind').value];if(maskUrl&&document.getElementById('masks').checked){const mask=await img(maskUrl);if(token!==renderToken)return;ctx.drawImage(mask,roi[0]*mask.width/c.raw_hw[1],roi[1]*mask.height/c.raw_hw[0],(roi[2]-roi[0])*mask.width/c.raw_hw[1],(roi[3]-roi[1])*mask.height/c.raw_hw[0],ox,oy,(roi[2]-roi[0])*scale,(roi[3]-roi[1])*scale)}observedLines(ctx,m);regions(ctx,m);measurements(ctx,m)}else{wire(ctx,m.coarse_xy,color,false,.5);points(ctx,m.points,color)}}
 if(s===4){if(document.getElementById('alternatives').checked)for(const a of(m.candidate_xy||[]).slice(0,12))wire(ctx,a,'#707e8b',true,.32);wire(ctx,m.final_xy,color);if(m.states)measurements(ctx,m)}
 if(s===5){wire(ctx,m.final_xy,color);if(m.states)for(let k=0;k<8;k++)if(m.states[k]==='S')point(ctx,m.final_state_xy?.[k],`${k}:S 투영`,STATE.S,'hollow')}
 ctx.restore();renderStats.canvases++;canvas.dataset.drawn='true';canvas.onclick=()=>{const target=document.getElementById('viewerImage');target.getContext('2d').drawImage(canvas,0,0,target.width,target.height);document.getElementById('viewerCaption').textContent=`${c.id} · ${METHODS.find(r=>r[0]===key)[1]} · ${STAGES[s]} · ${metric(c,key)}`;document.getElementById('viewer').showModal()};
}
function caption(m,key,s){const b=['YOLO 입력 좌표. 다음 열도 같은 원본 프레임을 사용합니다.',m.intermediate_label||'저장된 보정 좌표',m.states?'자기 초기 자세에서 판정한 상태. S는 초기 모델 투영으로만 표시합니다.':'자기 좌표와 공통 F로 계산한 저장 초기 자세',m.states?'청록 점=실제 영상 표본, 노랑=저장 관측선, 색 점=실제 B/I 관측, 회색×=원좌표':'이 경로는 상태별 마스크·B/I 보정을 사용하지 않습니다.',m.solver_label||'저장된 공통 F의 최종 자세. 별도 후보 궤적은 없습니다.','저장된 최종 자세. S 점은 모델 투영이며 영상 관측이 아닙니다.'];return b[s]}
function details(m,s){if(s===2&&m.states)return `<p class="statekey">${m.states.map((v,k)=>`${k}:${v}`).join(' ')}</p>`;
 if(s===3&&m.states){let rows=(m.measurements||[]).map(a=>{let k=a.native_corner??a.native_id,p=m.points?.[k],d=finite(p)&&finite(a.xy)?Math.hypot(p[0]-a.xy[0],p[1]-a.xy[1]):null;return `<tr><td>${k}:${esc(a.state)}</td><td>${fmt(d,3)}px</td><td>${esc(a.source||'')}${a.used_as_complete_final_likelihood===false?' · 최종 점 우도 철회(빈 원)':''}</td></tr>`}).join('');return `<details><summary>B/I 이동량·관측 출처 (${(m.measurements||[]).length}점)</summary><table><tr><th>KP</th><th>이동</th><th>출처</th></tr>${rows}</table></details>`}
 if(s===4&&m.solver){let v=m.solver;return `<p>accepted=${esc(v.accepted)} · fallback=${esc(v.fallback)} · ambiguity=${esc(v.ambiguity)} · 영역 제약=${esc(v.region_domain_count)}</p><details><summary>저장된 선택 기록</summary><pre class="audit">${esc(JSON.stringify(v,null,2))}</pre></details>`}return ''}
async function render(){renderToken++;const token=renderToken;renderStats.complete=false;renderStats.canvases=0;renderStats.missingImages=[];const c=DATA.cases[selected];renderStats.lastID=c.id;
 document.getElementById('case').value=String(selected);document.getElementById('position').textContent=`${selected+1} / ${DATA.cases.length}장`;let visible=visibleCases(),filteredPosition=visible.indexOf(selected);document.getElementById('prev').disabled=filteredPosition<=0;document.getElementById('next').disabled=filteredPosition<0||filteredPosition===visible.length-1;
 document.getElementById('caseInfo').innerHTML=`<b>${esc(c.id)}</b> · 제외 원인: ${c.reasons.map(r=>`<span class="badge">${esc(r)}</span>`).join('')}<div class="legend"><span style="color:${STATE.B}">B: 배경과 접한 보이는 점</span><span style="color:${STATE.I}">I: 주변이 팔렛인 보이는 점</span><span style="color:${STATE.O}">O: 외부 가림</span><span>T: 화면 밖</span><span>U: 불확실</span><span>S: 자기 가림</span><span>점×=모델/KP 예측 · 원●=실제 B/I 관측</span></div>`;
 document.querySelectorAll('[data-stage]').forEach(b=>b.classList.toggle('active',Number(b.dataset.stage)===stage));
 let grid=document.getElementById('grid');grid.innerHTML='<div class="method">진행 단계</div>'+METHODS.map(([key,name,color])=>`<div class="method" style="--color:${color}">${esc(name)}<div class="metric">${metric(c,key)}</div></div>`).join('');
 let todo=[];for(let s=0;s<STAGES.length;s++){let row=document.createElement('div');row.className='stageRow'+(stage!==-1&&stage!==s?' hidden':'');row.dataset.stageRow=s;row.innerHTML=`<div class="stageTitle">${STAGES[s]}</div>`+METHODS.map(([key,name,color])=>{let m=c.methods[key],unused=s===3&&!m.states;return `<section class="panel ${unused?'unavailable':''}" data-method="${key}" data-step="${s}"><h3>${esc(caption(m,key,s))}</h3><canvas width="960" height="540" aria-label="${esc(name+' '+STAGES[s])}"></canvas>${s===5?`<p class="metric">${metric(c,key)}</p>`:''}${m.notes?.[s]?`<p>${esc(m.notes[s])}</p>`:''}${details(m,s)}</section>`}).join('');grid.append(row);if(stage===-1||stage===s)for(const panel of row.querySelectorAll('.panel'))todo.push(draw(panel.querySelector('canvas'),c,panel.dataset.method,s));}
 try{await Promise.all(todo);if(token===renderToken){renderStats.complete=true;document.getElementById('error').style.display='none';document.body.dataset.ready='true'}}catch(e){if(token===renderToken){document.getElementById('error').textContent=e.message;document.getElementById('error').style.display='block'}}
}
function changeCase(n){if(n<0||n>=DATA.cases.length)return;selected=n;render()}
function visibleCases(){return [...document.querySelectorAll('#case option')].filter(o=>!o.hidden).map(o=>Number(o.value))}
function moveCase(direction){const visible=visibleCases(),p=visible.indexOf(selected),next=p+direction;if(next>=0&&next<visible.length)changeCase(visible[next])}
function filterOptions(){let q=document.getElementById('search').value.toLowerCase();document.querySelectorAll('#case option').forEach(o=>o.hidden=!o.textContent.toLowerCase().includes(q));const visible=visibleCases();document.getElementById('searchState').textContent=q?(visible.length?`${visible.length}장 검색됨`:'검색 결과 없음 · 기존 이미지 유지'):'';if(q&&visible.length)changeCase(visible[0]);else render()}
document.getElementById('case').innerHTML=DATA.cases.map((c,i)=>`<option value="${i}">${i+1}. ${esc(c.id)}</option>`).join('');document.getElementById('case').onchange=e=>changeCase(Number(e.target.value));
document.getElementById('prev').onclick=()=>moveCase(-1);document.getElementById('next').onclick=()=>moveCase(1);document.getElementById('search').addEventListener('input',filterOptions);
document.getElementById('stageButtons').innerHTML=[[-1,'전체 과정'],...STAGES.map((s,i)=>[i,s])].map(([i,s])=>`<button data-stage="${i}">${s}</button>`).join('');document.querySelectorAll('[data-stage]').forEach(b=>b.onclick=()=>{stage=Number(b.dataset.stage);render()});
for(const id of['viewport','maskKind','masks','rays','alternatives'])document.getElementById(id).onchange=render;
document.getElementById('reset').onclick=()=>{stage=-1;document.getElementById('search').value='';document.getElementById('viewport').value='roi';for(const id of['masks','rays','alternatives'])document.getElementById(id).checked=true;filterOptions();render()};
document.getElementById('closeViewer').onclick=()=>document.getElementById('viewer').close();document.getElementById('viewer').onclick=e=>{if(e.target===document.getElementById('viewer'))e.target.close()};
document.addEventListener('keydown',e=>{if(['INPUT','SELECT','TEXTAREA'].includes(document.activeElement.tagName)||document.getElementById('viewer').open)return;if(e.key==='ArrowRight')moveCase(1);if(e.key==='ArrowLeft')moveCase(-1)});
window.parallelGalleryControl={case:changeCase,stage:n=>{stage=n;return render()},render,data:DATA};
render();
