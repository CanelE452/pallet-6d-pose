<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>리프터 대상 대응 검수</title><link rel="stylesheet" href="/style.css"></head>
<body>
<main>
  <h1>리프터 고정 선택 객체 대응 검수</h1>
  <p class="notice">코너·오차·방법 이름은 표시하지 않습니다. 노란 상자는 이미 고정된 단일 선택 객체입니다.</p>
  <section id="identity">
    <label>검수자 ID <input id="reviewer" autocomplete="off"></label>
    <label><input id="prior" type="checkbox"> 이전 수동 주석을 본 적 있음</label>
    <label>노출 메모 <input id="notes" autocomplete="off"></label>
    <label><input id="confirm" type="checkbox"> 실제 사람이 직접 판정함을 확인</label>
  </section>
  <div id="progress"></div>
  <canvas id="canvas"></canvas>
  <div id="frame"></div>
  <fieldset><legend>노란 상자가 수동 참조 대상과 같은 객체인가?</legend>
    <label><input type="radio" name="decision" value="same"> 같음</label>
    <label><input type="radio" name="decision" value="different"> 다름</label>
    <label><input type="radio" name="decision" value="undetermined"> 판단 불가</label>
  </fieldset>
  <label>판정 메모 <input id="reason" autocomplete="off"></label>
  <label>기존 판정 수정 사유 <input id="edit" autocomplete="off"></label>
  <div><button id="start">검수 시작/재개</button><button id="save">저장</button><button id="prev">이전</button><button id="next">다음</button><a href="/api/export">JSON 내보내기</a></div>
  <pre id="message"></pre>
</main><script src="/app.js"></script></body></html>
