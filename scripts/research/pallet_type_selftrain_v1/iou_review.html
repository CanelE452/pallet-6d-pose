<!doctype html><html lang="ko"><meta charset="utf-8"><title>일반 플라스틱 249장 — IoU 비교</title>
<style>body{margin:0;background:#101922;color:#edf2f6;font:15px system-ui}header{position:sticky;top:0;background:#142634;padding:14px 22px;z-index:2}h1{font-size:21px;margin:0}p{margin:8px 0}select{padding:7px;margin:4px;background:#244154;color:white;font:inherit}.card{margin:16px;padding:14px;border:1px solid #476376;border-radius:8px}.card img{width:100%;display:block;margin:10px 0;cursor:zoom-in}.warn{color:#ffd38c}.muted{color:#a6bdce;font-size:13px}a{color:#78c6ff}</style>
<header><h1>일반 플라스틱 249장 — 코너 외곽 IoU</h1><p>코너 8개의 convex hull 겹침. 검출 박스 IoU가 아닙니다. 변형 좌표는 원본 크기로 복원했습니다.</p>
<select id="mode"><option value="either">둘 중 하나라도 낮음</option><option value="correction">보정 전 ↔ 후</option><option value="augmentation">원본 보정 ↔ 변형 후 보정 (4개 중 최소)</option></select>
<select id="threshold"><option value="0.9">IoU 0.9</option><option value="0.8">IoU 0.8</option><option value="0.7">IoU 0.7</option></select>
<select id="subset"><option value="reject">기준 미달만 보기</option><option value="keep">통과만 보기</option><option value="all">전체 보기</option></select>
<p id="counts"></p><p class="warn">가상 탈락 장수입니다. 실제 라벨 제외·재학습은 하지 않았습니다. 낮은 IoU가 오답이라는 뜻은 아니며, 높은 IoU여도 내부 코너 오류는 남을 수 있습니다.</p>
<p class="muted">왼쪽부터 R0 · 보정 좌표 · 보정 전후 외곽 겹침 · 가장 IoU가 낮은 변형과 겹침. 각 패널의 파랑/노랑 설명을 확인하세요. <a href="../stability_review/index.html">수동 유지/제외 검토 화면</a></p></header><main id="cards"></main>
<script>const DATA=__DATA__;const el=id=>document.getElementById(id);function render(){const mode=el('mode').value,t=Number(el('threshold').value),subset=el('subset').value;const n=DATA.filter(r=>r[mode]<t).length;el('counts').textContent=`249장 중 기준 미달 ${n}장 / 유지 ${249-n}장 (${((249-n)/249*100).toFixed(1)}%)`;el('cards').replaceChildren();DATA.filter(r=>subset==='all'||(subset==='reject'?r[mode]<t:r[mode]>=t)).sort((a,b)=>a[mode]-b[mode]||a.id.localeCompare(b.id)).forEach(r=>{const d=document.createElement('article');d.className='card';const title=document.createElement('p');title.textContent=`#${r.rank} · ${r.session} | 보정 전후 IoU ${r.correction.toFixed(4)} | 변형 최소 IoU ${r.augmentation.toFixed(4)} (${r.worst_variant}) | 최대 코너 이동: 보정 ${r.correction_max_px.toFixed(1)}px / 변형 ${r.augmentation_max_px==null?'결측':r.augmentation_max_px.toFixed(1)+'px'}`;d.append(title);const im=document.createElement('img');im.src=r.asset;im.loading='lazy';im.alt=title.textContent;im.onclick=()=>window.open(r.asset,'_blank');d.append(im);const p=document.createElement('p');p.className='muted';p.textContent=r.image.path;d.append(p);el('cards').append(d)})}['mode','threshold','subset'].forEach(id=>el(id).onchange=render);render();</script></html>
