[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pallet-point-line-v5"
version = "0.1.0"
description = "Research core for dimension-conditioned, symmetry-consistent point/line pose estimation"
requires-python = ">=3.10"
dependencies = ["torch>=2.4", "numpy>=1.24"]

[project.optional-dependencies]
test = ["pytest>=8", "opencv-python>=4.8"]

[tool.setuptools.packages.find]
include = ["plpose_v5*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
